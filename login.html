<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify - Log in or Sign up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-logo">Spotify</a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="#">Premium</a></li>
        <li><a href="#">Support</a></li>
        <li><a href="#">Download</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <div id="auth-container" class="flex-row">

      <section class="auth-section" id="login">
        <h2>Log in to Spotify</h2>

        <form class="auth-form" action="#" method="post">

          <div class="form-group">
            <label for="login-email">Email or username</label>
            <input
              type="text"
              id="login-email"
              name="email"
              placeholder="Email or username"
              required
            />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Password"
              required
            />
          </div>

          <div class="form-group form-checkbox">
            <input type="checkbox" id="remember-me" name="remember" />
            <label for="remember-me">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            Log in
          </button>

          <a href="#" class="forgot-link">Forgot your password?</a>

        </form>

        <p class="auth-switch">
          Don't have an account? <a href="signUp.html">Sign up for Spotify</a>
        </p>
      </section>

    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-cols flex-row">

      <div class="footer-col">
        <h3>Company</h3>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Jobs</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h3>Communities</h3>
        <ul>
          <li><a href="#">For Artists</a></li>
          <li><a href="#">Developers</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h3>Useful Links</h3>
        <ul>
          <li><a href="#">Support</a></li>
          <li><a href="index.html">Home</a></li>
          <li><a href="browse.html">Browse</a></li>
        </ul>
      </div>

    </div>

    <hr />
    <p class="footer-copy">&copy; 2026 Spotify AB</p>
  </footer>

</body>
</html>
